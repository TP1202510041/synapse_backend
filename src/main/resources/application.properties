# ===============================
# DATABASE CONFIGURATION - Azure SQL Server
# ===============================
spring.application.name=Synapse

# Spring DataSource Configuration
spring.datasource.url=jdbc:sqlserver://synapse-server.database.windows.net:1433;database=synapse-bd;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30
spring.datasource.username=synapse
spring.datasource.password=${DB_PSWD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.defer-datasource-initialization=false

# ===============================
# SWAGGER/OPENAPI CONFIGURATION
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=5000

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.proyecto.synapsevr=DEBUG

# ===============================
# EMAIL CONFIGURATION (Gmail SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=synapseupc@gmail.com
